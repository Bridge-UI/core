name: Bridge UI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  cancel-in-progress: true
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - run: npm run lint

  format:
    name: Prettier
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - run: npm run format:check

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: Lockfile only resolves from the npm registry
        run: node scripts/check-lockfile.mjs
      - name: Docs only install known packages
        run: node scripts/check-install-commands.mjs
      - name: Registry signatures and provenance
        run: npm audit signatures

  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version: 24
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache-dist
        with:
          path: |
            packages/vue/dist
            packages/core/dist
            packages/react/dist
          key: build-dist-${{ hashFiles('package-lock.json', 'packages/**/src/**', 'packages/**/env.d.ts', 'packages/**/tsconfig.json', 'packages/**/vite.config.ts', 'packages/**/tsconfig.*.json') }}
      - run: npm ci
      - run: npm run build
        if: steps.cache-dist.outputs.cache-hit != 'true'

  type-check:
    needs: build
    name: TypeScript
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version: 24
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache-dist
        with:
          path: |
            packages/vue/dist
            packages/core/dist
            packages/react/dist
          key: build-dist-${{ hashFiles('package-lock.json', 'packages/**/src/**', 'packages/**/env.d.ts', 'packages/**/tsconfig.json', 'packages/**/vite.config.ts', 'packages/**/tsconfig.*.json') }}
      - run: npm ci
      - run: npm run build:core
        if: steps.cache-dist.outputs.cache-hit != 'true'
      - run: npm run type-check

  test:
    needs: build
    runs-on: ubuntu-latest
    name: Unit tests (${{ matrix.package }})
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        package: [vue, core, react]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version: 24
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache-dist
        with:
          path: |
            packages/vue/dist
            packages/core/dist
            packages/react/dist
          key: build-dist-${{ hashFiles('package-lock.json', 'packages/**/src/**', 'packages/**/env.d.ts', 'packages/**/tsconfig.json', 'packages/**/vite.config.ts', 'packages/**/tsconfig.*.json') }}
      - run: npm ci
      - run: npm run build:core
        if: steps.cache-dist.outputs.cache-hit != 'true'
      - run: npm run test:${{ matrix.package }}

  cypress:
    needs: build
    runs-on: ubuntu-latest
    name: Cypress (${{ matrix.package }})
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        package: [vue, react]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version: 24
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache-dist
        with:
          path: |
            packages/vue/dist
            packages/core/dist
            packages/react/dist
          key: build-dist-${{ hashFiles('package-lock.json', 'packages/**/src/**', 'packages/**/env.d.ts', 'packages/**/tsconfig.json', 'packages/**/vite.config.ts', 'packages/**/tsconfig.*.json') }}
      - run: npm ci
      - run: npm run build:core
        if: steps.cache-dist.outputs.cache-hit != 'true'
      - name: Install Cypress binary
        run: npx cypress install
      - name: Component tests
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6.10.9
        with:
          install: false
          project: packages/${{ matrix.package }}
          command: npm run test:cy:${{ matrix.package }}
