name: Bridge UI Release

on:
  push:
    tags:
      - "v*"

concurrency:
  cancel-in-progress: false
  group: release-${{ github.ref }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Installs dependencies, builds, tests and packs. Has no publish rights: a
  # compromised dependency running here cannot mint an npm OIDC token.
  build:
    runs-on: ubuntu-latest
    name: Build and pack
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    outputs:
      npm_tag: ${{ steps.release.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve version
        id: release
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid tag: $TAG"
            exit 1
          fi

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            NPM_TAG=latest
          elif [[ "$VERSION" =~ -beta(\.|$) ]]; then
            NPM_TAG=beta
          elif [[ "$VERSION" =~ -rc(\.|$) ]]; then
            NPM_TAG=rc
          elif [[ "$VERSION" =~ -alpha(\.|$) ]]; then
            NPM_TAG=alpha
          else
            NPM_TAG=next
          fi

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG (npm dist-tag: $NPM_TAG)"

      # No dependency cache on the release path: a poisoned cache would ship.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify package versions
        env:
          VERSION: ${{ steps.release.outputs.value }}
        run: |
          for pkg in core react vue; do
            PKG_VERSION=$(node -p "require('./packages/${pkg}/package.json').version")
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "packages/${pkg}/package.json version is ${PKG_VERSION}, expected ${VERSION}"
              exit 1
            fi
          done

          EXPECTED_DEP="^${VERSION}"
          REACT_DEP=$(node -p "require('./packages/react/package.json').dependencies['@bridge-ui/core']")
          VUE_DEP=$(node -p "require('./packages/vue/package.json').dependencies['@bridge-ui/core']")

          if [ "$REACT_DEP" != "$EXPECTED_DEP" ] || [ "$VUE_DEP" != "$EXPECTED_DEP" ]; then
            echo "dependencies.@bridge-ui/core must be ${EXPECTED_DEP} in react and vue"
            exit 1
          fi

      - run: npm run build
      - run: npm run test:run

      - name: Pack packages
        run: |
          mkdir -p packed
          for pkg in core react vue; do
            npm pack -w "@bridge-ui/${pkg}" --pack-destination packed
          done
          ls -l packed

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: packed/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Only publishes the tarballs built above. No checkout, no install, no
  # third-party code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    name: Publish packages to npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: packed

      - name: Publish packages
        env:
          NPM_TAG: ${{ needs.build.outputs.npm_tag }}
        run: |
          # core first: react and vue depend on it.
          for pkg in core react vue; do
            npm publish packed/bridge-ui-${pkg}-*.tgz --tag "$NPM_TAG" --access public --provenance --ignore-scripts
          done
